<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorMind AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .container h2 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .container p {
      font-size: 18px;
      color: #4b5563;
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>CreatorMind AI 🤖</h1>
  </header>

  <div class="container">
    <div class="box">
      <h2>Welcome to CreatorMind AI</h2>

      <p>
        Create amazing content with the power of AI.
      </p>

      <a href="index.html" class="button">← Back to Home</a>
    </div>
  </div>

  <footer>
    © 2026 CreatorMind AI
  </footer>

</body>
</html>
