<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 600px;
      font-size: 18px;
      color: #4b5563;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Website</h1>
  </header>

  <section class="hero">
    <h2>Welcome 👋</h2>
    <p>
      This is my new website. Here you can add your ideas,
      services, tools or anything you want.
    </p>

    <a href="#" class="button">Get Started</a>
  </section>

  <footer>
    © 2026 My Website
  </footer>

</body>
      </html>
